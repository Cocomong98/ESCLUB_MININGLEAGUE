[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:backend]
command=/opt/venv/bin/gunicorn --chdir /app/backend --bind 127.0.0.1:5001 --workers 1 --threads 4 --timeout 120 --access-logfile - --error-logfile - app:app
directory=/app/backend
environment=PORT="5001",HOST="127.0.0.1",NODE_ENV="production"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:scheduler]
command=/opt/venv/bin/python /app/backend/app.py scheduler
directory=/app/backend
environment=TZ="Asia/Seoul",NODE_ENV="production"
autostart=true
autorestart=true
priority=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:frontend]
command=/usr/local/bin/node /app/.output/server/index.mjs
directory=/app
environment=PORT="3000",HOST="0.0.0.0",NODE_ENV="production"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
